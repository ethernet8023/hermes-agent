name: Docker / shell lint

# Lints the container build inputs: Dockerfile (via hadolint) and any shell
# scripts under docker/ (via shellcheck). These catch the class of regression
# the behavioral docker smoke test can't — unquoted variable
# expansions, silently-failing RUN commands, etc.
#
# Rules and ignores are documented in .hadolint.yaml at the repo root.
# shellcheck severity is pinned to `error` so SC1091-style "can't follow
# sourced script" info-level warnings don't fail the job — the .venv
# activate script doesn't exist at lint time.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docker-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: Lint Dockerfile (hadolint)
    # arc-runner-docker, NOT arc-runner-small: hadolint-action declares
    # `runs: using: docker`, so the runner builds and runs it as a container
    # and needs a real daemon — even though no step here shells out to
    # docker. Grepping job bodies for docker commands misses this; check
    # each action's `runs.using` before routing a job to a dind-less set.
    runs-on: arc-runner-docker
    timeout-minutes: 5
    steps:
      - name: Seed git objects from the node-local mirror
        # The GKE runner nodes keep a bare mirror of this repo on local disk
        # (hermes-agent-ci-infra k8s/git-mirror-daemonset.yaml). Pointing a fresh
        # .git at it via alternates makes the checkout below resolve nearly every
        # object locally — ~1MB fetched instead of ~61MB. That matters because ~40
        # pods check out at once and saturate the pool's egress; measured on a
        # seeded node, 4-6s vs 7-17s for the same shallow checkout.
        #
        # actions/checkout is unmodified: it reuses an existing .git when the fetch
        # URL matches (git-directory-helper.ts prepareExistingDirectory), so this
        # survives into the real checkout.
        shell: bash
        run: |
          set -euo pipefail
          MIRROR=/mnt/git-mirror/hermes-agent.git
          # Absent on ubuntu-latest, the arm64 pool, and any node whose mirror has
          # not seeded yet. Never fail a job over it — a normal checkout follows.
          if [ ! -d "$MIRROR/objects" ]; then
            echo "::notice::no node mirror, using a normal checkout"; exit 0
          fi
          # Written by the DaemonSet as root, jobs run as uid 1001; git refuses a
          # repo owned by another user regardless of file permissions.
          git config --global --add safe.directory "$MIRROR"
          if ! git -C "$MIRROR" rev-parse --git-dir >/dev/null 2>&1; then
            echo "::warning::node mirror unreadable, using a normal checkout"; exit 0
          fi
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then exit 0; fi
          git init --quiet "$GITHUB_WORKSPACE"
          echo "$MIRROR/objects" > "$GITHUB_WORKSPACE/.git/objects/info/alternates"
          echo "::notice::seeded git alternates from $MIRROR"

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

  shellcheck:
    name: Lint docker/ shell scripts (shellcheck)
    # Short gate job: small runner, no dind (see hermes-agent-ci-infra).
    runs-on: arc-runner-small
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        env:
          # Severity = error: SC1091 (can't follow sourced script) is info-
          # level and would otherwise fail when the venv activate script
          # doesn't exist at lint time.
          SHELLCHECK_OPTS: --severity=error
        with:
          scandir: ./docker
