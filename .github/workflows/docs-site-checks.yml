name: Docs Site Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs-site-checks:
    runs-on: arc-runner-set
    timeout-minutes: 20
    steps:
      - name: Seed git objects from the node-local mirror
        # The GKE runner nodes keep a bare mirror of this repo on local disk
        # (hermes-agent-ci-infra k8s/git-mirror-daemonset.yaml). Pointing a fresh
        # .git at it via alternates makes the checkout below resolve nearly every
        # object locally — ~1MB fetched instead of ~61MB. That matters because ~40
        # pods check out at once and saturate the pool's egress; measured on a
        # seeded node, 4-6s vs 7-17s for the same shallow checkout.
        #
        # actions/checkout is unmodified: it reuses an existing .git when the fetch
        # URL matches (git-directory-helper.ts prepareExistingDirectory), so this
        # survives into the real checkout.
        shell: bash
        run: |
          set -euo pipefail
          MIRROR=/mnt/git-mirror/hermes-agent.git
          # Absent on ubuntu-latest, the arm64 pool, and any node whose mirror has
          # not seeded yet. Never fail a job over it — a normal checkout follows.
          if [ ! -d "$MIRROR/objects" ]; then
            echo "::notice::no node mirror, using a normal checkout"; exit 0
          fi
          # Written by the DaemonSet as root, jobs run as uid 1001; git refuses a
          # repo owned by another user regardless of file permissions.
          git config --global --add safe.directory "$MIRROR"
          if ! git -C "$MIRROR" rev-parse --git-dir >/dev/null 2>&1; then
            echo "::warning::node mirror unreadable, using a normal checkout"; exit 0
          fi
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then exit 0; fi
          git init --quiet "$GITHUB_WORKSPACE"
          echo "$MIRROR/objects" > "$GITHUB_WORKSPACE/.git/objects/info/alternates"
          echo "::notice::seeded git alternates from $MIRROR"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: npm-cache
        with:
          path: website/node_modules
          # node26: native builds + engine checks are node-major-specific;
          # keep in sync with NODE_MAJOR in the runner image (see
          # hermes-agent-ci-infra runner/Dockerfile).
          key: node-modules-cache-node26-${{ hashFiles('website/package-lock.json') }}

      - name: Install website dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci
          working-directory: website
        if: steps.npm-cache.outputs.cache-hit != 'true'

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install ascii-guard
        uses: ./.github/actions/retry
        with:
          command: python3 -m pip install ascii-guard==2.3.0 pyyaml==6.0.3

      - name: Extract skill metadata for dashboard
        run: python3 website/scripts/extract-skills.py

      - name: Regenerate per-skill docs pages + catalogs
        run: python3 website/scripts/generate-skill-docs.py

      - name: Lint docs diagrams
        run: npm run lint:diagrams
        working-directory: website

      - name: Build Docusaurus
        uses: ./.github/actions/profile
        with:
          label: docs-site-build
          working-directory: website
          command: npm run build
