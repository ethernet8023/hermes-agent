name: Native Windows ARM64 raw CUDA acceptance smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-cuda:
    if: github.repository == 'ethernet8023/hermes-agent' && github.ref == 'refs/heads/smoke/native-fallback'
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup-windows-build-deps
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          extras: '[]'
          test-environment: 'true'
          cache: 'false'
          cache-python: 'false'
      - name: Run pinned raw CUDA download, pause/resume, and engine commands
        shell: bash
        env:
          HERMES_TEST_FILE_RETRIES: '0'
        run: scripts/run_tests.sh tests/integration/test_local_runtime_pm_download.py -q
