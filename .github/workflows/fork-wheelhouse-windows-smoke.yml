name: Fork Windows ARM64 wheelhouse consumer smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-consumer:
    if: github.repository == 'ethernet8023/hermes-agent' && github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          cache: 'false'
      - name: Require native wheels without preparing compilers
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import platform,sys; assert platform.machine() == "ARM64" and sys.version_info[:2] == (3,14)'
          # Derive the native build ban from the pinned URL sources so a new
          # native dependency cannot silently slip through as an sdist.
          # Windows Python writes CRLF to redirected stdout; strip CR before
          # handing package names to uv (same contract as the OS test selector).
          mapfile -t native < <(python -c 'import tomllib; p=tomllib.load(open("pyproject.toml","rb")); print("\n".join(sorted(n for n,v in p["tool"]["uv"]["sources"].items() if any("/wheelhouse/" in x.get("url","") for x in v))))' | tr -d '\r')
          test "${#native[@]}" -gt 0
          ban=()
          for package in "${native[@]}"; do ban+=(--no-build-package "$package"); done
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/cold-wheelhouse-env" UV_PYTHON="$HERMES_PYTHON"
          uv sync --locked --all-extras --no-extra kittentts --no-dev --no-install-project "${ban[@]}"
          "$UV_PROJECT_ENVIRONMENT/Scripts/python.exe" -c 'import anydoc,brotlicffi,cryptography,davey,dependency_injector,httptools,obstore,pilk; from cryptography.hazmat.bindings._rust import openssl; print("native wheels import cleanly")'
          # PM's public build path must make the same locked selection. The
          # runner has not set up MSVC/Rust/OpenSSL for dependency builds.
          python -m pm.build_env --source . --out "$RUNNER_TEMP/pm-wheelhouse-env" --all-extras --no-install-project --explicit
          "$RUNNER_TEMP/pm-wheelhouse-env/Scripts/python.exe" -c 'import anydoc,brotlicffi,cryptography,davey,dependency_injector,httptools,obstore,pilk; from cryptography.hazmat.bindings._rust import openssl; print("PM native wheels import cleanly")'
