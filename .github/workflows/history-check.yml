name: History Check

# Rejects PRs whose branch has no common ancestor with main.
#
# GitHub's merge UI does not refuse unrelated-history merges. PR #25045
# (May 2026) landed from a disconnected branch: its parent-less root commit
# was grafted into main as a second root and `git blame` for ~1500 files
# collapsed onto it.

on:
  workflow_call:
    outputs:
      review_status:
        description: "JSON array of review_status objects for the synthesizer."
        value: ${{ jobs.check-common-ancestor.outputs.review_status }}

permissions:
  contents: read

jobs:
  check-common-ancestor:
    # Short gate job: small runner, no dind (see hermes-agent-ci-infra).
    runs-on: arc-runner-small
    timeout-minutes: 10
    outputs:
      review_status: ${{ steps.merge-base-check.outputs.review_status }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve merge base
        id: mb
        uses: ./.github/actions/merge-base
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          # Absence is the thing this job measures — report it below, in our
          # own words, instead of dying with the action's generic error.
          fail-on-missing: 'false'

      - id: merge-base-check
        name: Reject PRs with no common ancestor on main
        env:
          FOUND: ${{ steps.mb.outputs.found }}
          BASE: ${{ steps.mb.outputs.sha }}
        run: |
          if [ "$FOUND" != "true" ]; then
            STATUS='[{"source":"unrelated histories","results":[{"kind":"action_required","title":"Unrelated histories","summary":"This PR has no common ancestor with main.","detail":"","how_to_fix":"Rebase your changes onto current main:\n```\ngit fetch origin main\ngit checkout -b fix-branch origin/main\n# re-apply your changes (cherry-pick, copy files, etc.)\ngit push -f origin fix-branch\n```\n"}]}]'
            echo "review_status=${STATUS}" >> "$GITHUB_OUTPUT"
            echo "::error::This PR has no common ancestor with main. Merging it would"\
                 "graft a parent-less root commit into main and collapse git blame for"\
                 "every file in the snapshot. Rebase onto current main:"\
                 "git fetch origin main && git checkout -b fix-branch origin/main,"\
                 "re-apply your changes, then force-push."
            exit 1
          fi
          echo "::notice::Common ancestor with main: $BASE"
          echo "review_status=[]" >> "$GITHUB_OUTPUT"
