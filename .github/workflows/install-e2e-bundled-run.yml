name: install-e2e bundled run

# Runs ONE bundled desktop install/update combination: installs a bundled
# desktop app from the PREV tag's installer, then updates it to HEAD's
# installer through the app's own Update button (electron-updater).
#
# The bundles are built by install-e2e-bundled-build.yml — one build for
# the prev tag (the starting version) and one for HEAD (the update
# target).  This workflow downloads both, serves them via a local HTTP
# server (the electron-updater feed), installs from the prev-tag
# installer, then clicks "Update now" in the running app.
#
# The driver reuses the existing per-OS desktop E2E drivers
# (windows-e2e.ps1, macos-desktop-e2e.sh) with a new "bundled-installer"
# install method that points at the locally-built artifacts instead of
# the website's published installers.
#
# Call it:
#
#   jobs:
#     bundled:
#       uses: ./.github/workflows/install-e2e-bundled-run.yml
#       with:
#         os: windows
#         prev-tag: v2026.8.13
#         head-sha: abc123def
#         leg-id: bundled-windows-v2026.8.13

on:
  workflow_call:
    inputs:
      os:
        description: 'Target OS: windows, macos, or linux.'
        required: true
        type: string
      prev-tag:
        description: 'Release tag to install FROM (the starting version).'
        required: true
        type: string
      head-sha:
        description: 'The HEAD commit SHA (the update target). Bundles are built at this ref.'
        required: true
        type: string
      leg-id:
        description: 'Artifact-safe matrix leg id for log naming.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: bundled ${{ inputs.os }}
    runs-on: ${{ (inputs.os == 'windows' && 'windows-2025') || (inputs.os == 'macos' && 'macos-15') || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      # Sibling of the checkout, outside the repo so the install never
      # collides with the checkout.
      HERMES_E2E_WORKROOT: ${{ github.workspace }}/..

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # ── Download the PREV-tag bundles ───────────────────────────────
      # The build workflow names artifacts hermes-bundled-<target>-<label>,
      # where target is the platform label (win32-x64, darwin-arm64, linux-x64).
      # continue-on-error: the prev tag may not support bundled builds
      # (predates installation/runtime-pins.json). If the artifact doesn't
      # exist, the test skips gracefully.
      - name: Download prev-tag bundles
        id: prev-artifacts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hermes-bundled-${{ inputs.os == 'windows' && 'win32-x64' || inputs.os == 'macos' && 'darwin-arm64' || 'linux-x64' }}-prev
          path: ${{ github.workspace }}/bundles/prev

      - name: Check prev-tag artifacts
        id: has-prev
        shell: bash
        run: |
          if [ ! -d "${{ github.workspace }}/bundles/prev" ] || [ -z "$(ls -A '${{ github.workspace }}/bundles/prev' 2>/dev/null)" ]; then
            echo "::notice::No prev-tag bundles found — the prev tag likely predates bundled build support. Skipping."
            echo "has=false" >> "$GITHUB_OUTPUT"
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Download the HEAD bundles ───────────────────────────────────
      - name: Download HEAD bundles
        id: head-artifacts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hermes-bundled-${{ inputs.os == 'windows' && 'win32-x64' || inputs.os == 'macos' && 'darwin-arm64' || 'linux-x64' }}-head
          path: ${{ github.workspace }}/bundles/head

      - name: Check HEAD artifacts
        id: has-head
        shell: bash
        run: |
          if [ ! -d "${{ github.workspace }}/bundles/head" ] || [ -z "$(ls -A '${{ github.workspace }}/bundles/head' 2>/dev/null)" ]; then
            echo "::notice::No HEAD bundles found — the HEAD build may have failed. Skipping."
            echo "has=false" >> "$GITHUB_OUTPUT"
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if bundles missing
        if: steps.has-prev.outputs.has != 'true' || steps.has-head.outputs.has != 'true'
        shell: bash
        run: |
          echo "Bundles missing — skipping this leg."
          exit 0

      # ── Start screen recording ───────────────────────────────────────
      - name: Start screen recording
        if: steps.has-prev.outputs.has == 'true' && steps.has-head.outputs.has == 'true'
        uses: ./.github/actions/e2e-screen-record
        with:
          mode: start
          output: ${{ runner.temp }}/e2e-logs/recording.mkv

      # ── Run the bundled install+update E2E ──────────────────────────
      # The driver script receives the bundle directories and does:
      #   1. Stage: bare-clone the checkout, park main at prev-tag
      #   2. Install: run the prev-tag bundle's installer
      #   3. Update: advance main to HEAD, serve the HEAD bundle as the
      #      updater feed, click "Update now" in the running app
      - name: Run bundled install+update E2E
        if: steps.has-prev.outputs.has == 'true' && steps.has-head.outputs.has == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tests/install/bundled-e2e.sh \
            --os '${{ inputs.os }}' \
            --prev-tag '${{ inputs.prev-tag }}' \
            --head-sha '${{ inputs.head-sha }}' \
            --prev-bundles '${{ github.workspace }}/bundles/prev' \
            --head-bundles '${{ github.workspace }}/bundles/head'
        env:
          HERMES_E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs

      - name: Stop screen recording
        if: always() && steps.has-prev.outputs.has == 'true' && steps.has-head.outputs.has == 'true'
        uses: ./.github/actions/e2e-screen-record
        with:
          mode: stop
          output: ${{ runner.temp }}/e2e-logs/recording.mkv

      - name: Remux recording for browser playback
        if: always() && steps.has-prev.outputs.has == 'true' && steps.has-head.outputs.has == 'true'
        run: |
          set -euo pipefail
          if [ -f "${{ runner.temp }}/e2e-logs/recording.mkv" ]; then
            ffmpeg -y -hide_banner -loglevel error -i "${{ runner.temp }}/e2e-logs/recording.mkv" \
              -c copy "${{ runner.temp }}/e2e-logs/recording.mp4"
          fi

      - name: Upload logs
        if: always() && steps.has-prev.outputs.has == 'true' && steps.has-head.outputs.has == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-e2e-logs-${{ inputs.leg-id }}
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 14
          if-no-files-found: ignore
