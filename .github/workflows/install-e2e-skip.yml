name: Install & Update E2E — unsupported combo (reusable)

# A declared {os, install-method, update-method} combination whose OS has
# no driving E2E workflow at all (today: every macOS combo). The per-tag
# caller (install-e2e-tag.yml) fans out one of these per such combo so the
# coverage gap is its own named, NATIVELY SKIPPED check (grey,
# conclusion=skipped, no runner) in the Checks tab.
#
# OSes WITH a driving workflow don't come here: their unimplemented method
# pairs natively skip inside that workflow, next to the driver that will
# implement them (see install-e2e-windows-run.yml).
#
# `implemented` stays at its false default until the OS has a real driving
# workflow; flipping happens by routing the combo to that workflow in
# generate-e2e-matrix.mjs, never by setting this input.

on:
  workflow_call:
    inputs:
      implemented:
        description: 'Never set this. Combos become implemented by moving into IMPLEMENTED in generate-e2e-matrix.mjs, not by flipping the flag.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  todo:
    name: not implemented yet
    if: inputs.implemented
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: 'true'
