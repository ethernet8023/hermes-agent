name: Install & Update E2E — Windows desktop (reusable)

# Runs the REAL Windows desktop user flow against ONE update route:
# install OLD via the website's Hermes-Setup.exe (headed, AutoHotkey clicks
# Install -> Launch, the real Electron window must appear), then update
# OLD -> HEAD through the route a user would take.
#
# The Windows sibling of install-e2e-run.yml. No bubblewrap here — the
# driver (tests/install/windows-desktop-gui-e2e.ps1) fakes GitHub with
# git's own transport rewrite: a driver-owned GIT_CONFIG_GLOBAL carrying
# url.<file://serve.git>.insteadOf for both canonical repo URLs, so the
# installer and updater run byte-for-byte against their real URLs and land
# on a local bare repo. Its `main` serves OLD (install-ref, default: the
# newest release tag) during the install, then advances to HEAD for the
# update leg — an update becomes available exactly the way it does for a
# real user.
#
# Routes (from the update-method input):
#   desktop-app             the app's own Update button: the installed
#                           Hermes.exe runs under Playwright's Electron
#                           driver, which clicks Settings -> About ->
#                           "Update now"; the production hand-off chain runs
#                           untouched (marker, app quit, detached updater,
#                           hermes update, desktop rebuild, relaunch).
#   hermes-update           TODO: `hermes update` from the installed venv.
#   desktop-installer-rerun@latest
#                           TODO: re-run the bootstrap exe over the install.
#   irm-iex                 TODO: re-run the irm | iex one-liner.
#
# Method pairs without a driver yet NATIVELY SKIP (grey check, no runner):
# the capability knowledge lives here, next to the driver, so the caller
# can dispatch every declared combination without knowing which ones work.
#
# Call it:
#
#   jobs:
#     windows:
#       uses: ./.github/workflows/install-e2e-windows-run.yml
#       with:
#         install-method: desktop-installer@latest
#         update-method: desktop-app
#         install-ref: v2026.8.3

on:
  workflow_call:
    inputs:
      install-method:
        description: 'How OLD gets installed. Supported: desktop-installer@latest (website exe, AHK-clicked). Declared-but-TODO methods skip.'
        required: true
        type: string
      update-method:
        description: 'How the install updates to HEAD. Supported: desktop-app (Update button under Playwright). Declared-but-TODO methods skip.'
        required: true
        type: string
      install-ref:
        description: 'Ref to install as OLD (served as main while the installer runs). auto = the newest release tag in the checkout.'
        required: false
        type: string
        default: auto
      setup-exe-url:
        description: 'Bootstrap installer to install OLD with. Default: the latest published one — what a user downloads today.'
        required: false
        type: string
        default: https://hermes-assets.nousresearch.com/Hermes-Setup.exe
      timeout-minutes:
        description: 'Job timeout. The install leg does real toolchain work and the update leg a full Electron rebuild.'
        required: false
        type: number
        default: 240

permissions:
  contents: read

jobs:
  # Can this starting version run this flow at all? The desktop app
  # (apps/desktop) only exists in releases from v2026.5.31 on (#20059):
  # older tags have no window to launch and no Update button to click, so
  # desktop-method legs from them natively skip below. Data-driven from the
  # tag's own tree -- no hardcoded version list to rot.
  probe:
    name: probe tag
    if: inputs.install-method == 'desktop-installer@latest' && inputs.update-method == 'desktop-app'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-desktop: ${{ steps.probe.outputs.has-desktop }}
    steps:
      # Tree listings only: no blobs, full history + tags so any ref
      # resolves.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
      - id: probe
        run: |
          set -euo pipefail
          ref='${{ inputs.install-ref }}'
          if [ "$ref" = "auto" ]; then
            # Same choice the driver's stage phase makes: newest release tag.
            ref="$(git tag --list 'v[0-9]*' --sort=-creatordate | head -1)"
          fi
          if git ls-tree -d "$ref" apps/desktop | grep -q .; then
            has=true
          else
            has=false
          fi
          echo "ref $ref: has-desktop=$has"
          echo "has-desktop=$has" >> "$GITHUB_OUTPUT"

  e2e:
    # Static name on purpose: the caller's job name already carries the
    # method pair, and GitHub renders name expressions UNEXPANDED (literal
    # "${{ inputs... }}") on natively skipped jobs.
    name: run
    needs: probe
    # The one pair the driver can run today, and only from a starting
    # version that ships the desktop app. Anything else is a native skip:
    # a declared-TODO method pair, or a tag from before the app existed.
    # (When probe itself skipped, its output is empty and this is false.)
    if: inputs.install-method == 'desktop-installer@latest' && inputs.update-method == 'desktop-app' && needs.probe.outputs.has-desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    env:
      # Sibling of the checkout (D:\a\hermes-agent\hermes-desktop-gui-e2e):
      # outside the repo so the staged bare clone and the install never
      # collide with the checkout itself. NOTE: ${{ runner.temp }} is NOT
      # available in job-level env (only github/inputs/matrix/needs/
      # secrets/strategy/vars).
      HERMES_E2E_WORKROOT: ${{ github.workspace }}\..\hermes-desktop-gui-e2e

    steps:
      # Full history: the driver bare-clones this checkout as the repo the
      # installer/updater talk to, and the installer's baked release pin
      # must be reachable in that clone. A shallow checkout cannot serve
      # either need.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # ffmpeg records the screen for the whole run so a failed click is
      # diagnosable from the artifact instead of by guesswork. NOT
      # preinstalled on windows-latest; the driver skips recording
      # gracefully when it's absent, so this step is what makes the
      # recording actually happen. Cached — winget's ffmpeg download is
      # the slow part.
      - name: Restore cached ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ runner.temp }}\test-bins\ffmpeg
          key: e2e-ffmpeg-${{ runner.os }}-v1

      - name: Install ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $bins = "$env:RUNNER_TEMP\test-bins\ffmpeg"
          New-Item -ItemType Directory -Path $bins -Force | Out-Null
          winget install -e --id Gyan.FFmpeg --silent --accept-source-agreements --accept-package-agreements --disable-interactivity --location "$env:RUNNER_TEMP\ffmpeg_dir"
          Copy-Item -Path "$env:RUNNER_TEMP\ffmpeg_dir\*\*" -Destination $bins -Recurse -Force

      - name: Add ffmpeg to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\test-bins\ffmpeg\bin"

      - name: Stage serve repo (main -> OLD)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\install\windows-desktop-gui-e2e.ps1 -Phase stage -Route "${{ inputs.update-method }}" -InstallRef "${{ inputs.install-ref }}" -SetupExeUrl ${{ inputs.setup-exe-url }}

      - name: Install OLD via website Hermes-Setup.exe (headed, AHK-clicked)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\install\windows-desktop-gui-e2e.ps1 -Phase install-gui -Route "${{ inputs.update-method }}" -InstallRef "${{ inputs.install-ref }}" -SetupExeUrl ${{ inputs.setup-exe-url }}

      - name: Update OLD -> HEAD (${{ inputs.update-method }})
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\install\windows-desktop-gui-e2e.ps1 -Phase update-gui -Route "${{ inputs.update-method }}" -InstallRef "${{ inputs.install-ref }}" -SetupExeUrl ${{ inputs.setup-exe-url }}

      - name: Collect proof + logs
        if: always()
        shell: powershell
        run: |
          $out = "gui-e2e-proof"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $work = $env:HERMES_E2E_WORKROOT
          $home_ = Join-Path $work "hermes-home"
          foreach ($pair in @(
            @{ src = (Join-Path $work "proof");                          dst = "proof" },
            @{ src = (Join-Path $work "shas.json");                      dst = "shas.json" },
            @{ src = (Join-Path $home_ "logs");                          dst = "logs" },
            @{ src = (Join-Path $home_ ".hermes-update-result.json");    dst = ".hermes-update-result.json" }
          )) {
            if (Test-Path $pair.src) { Copy-Item $pair.src (Join-Path $out $pair.dst) -Recurse -Force }
          }

      - name: Upload proof + logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-e2e-windows-${{ inputs.update-method }}-${{ inputs.install-ref }}-${{ github.sha }}
          path: gui-e2e-proof
          retention-days: 14
          if-no-files-found: ignore
