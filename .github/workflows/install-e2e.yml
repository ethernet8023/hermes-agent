name: Install & Update E2E

# Can a user on a released version get to this commit?
#
# The support matrix -- every {os, install-method, update-method} combination
# a user could be on -- lives in scripts/sandbox/generate-e2e-matrix.mjs.
# The generate-matrix job expands it into ONE JOB PER COMBINATION:
#
#   * linux legs install a sampled release through the real
#     `curl | install.sh` one-liner (uv, a managed Python, Node, the venv)
#     inside scripts/dev-sandbox.sh, then apply the combo's update route and
#     require the checkout to land on this commit with a working `hermes`;
#   * windows legs run the real desktop user flow (install-e2e-windows-run
#     .yml): the website's Hermes-Setup.exe clicked by AutoHotkey, then the
#     update driven through the app itself, Playwright clicking "Update now";
#   * combinations the spec declares but CI can't drive yet (macOS, the
#     remaining windows install/update methods) fan out too, one NATIVELY
#     SKIPPED check per combo, so every coverage gap is enumerable from the
#     Checks tab.
#
# The linux starting versions are chosen at runtime from the repo's release
# tags (scripts/sandbox/pick-release-tags.sh): newest, oldest, and a spread
# between. A hardcoded list would stop covering the newest release the day
# after it ships, and would pin an "oldest" that nobody still runs. The
# windows starting version is the newest release tag (the published
# installer has no commit pin -- it installs what `main` serves, which the
# harness stages to that tag).
#
# Triggers:
#   * every 12 hours, so upstream drift (a new uv, a Node bump, a PyPI change)
#     surfaces on a schedule rather than in someone's review cycle;
#   * when a release tag is created -- the moment the set of versions users can
#     update FROM changes, and the moment a broken updater would strand them;
#   * manually, where you can pick the route and how many releases to sample.
#
# Deliberately NOT on pull_request: a leg takes ~11 minutes of real toolchain
# installation, and the matrix multiplies that. Updating is release-shaped work,
# so it is gated on releases and the clock instead.

on:
  workflow_dispatch:
    inputs:
      route:
        description: 'Which update route to exercise. all/both include the Windows desktop leg.'
        required: false
        type: choice
        default: all
        options: [all, both, update, installer, windows-desktop]
      tag-count:
        description: 'How many release tags to sample (newest, oldest, and a spread between).'
        required: false
        type: string
        default: '5'
  schedule:
    # Every 12 hours, off the hour to avoid the top-of-hour runner crunch.
    - cron: '20 7,19 * * *'
  push:
    tags:
      # Release tags only: the repo also carries backup/* and one-off tags.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: install-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which released versions do we test updating FROM? Resolved once and shared
  # by every linux leg, so all routes cover the same set.
  pick-releases:
    name: Pick release tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.pick.outputs.tags }}
    steps:
      # This job only reads tag names and runs one script, so take the cheap
      # checkout: no blobs (filter), no other files (sparse), but DO fetch tags
      # -- they are the whole input, and the default shallow checkout has none.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          filter: blob:none
          fetch-tags: true
          sparse-checkout: scripts/sandbox/pick-release-tags.sh
          sparse-checkout-cone-mode: false
      - id: pick
        run: |
          set -euo pipefail
          tags="$(scripts/sandbox/pick-release-tags.sh --count '${{ inputs.tag-count || 5 }}')"
          echo "Testing updates from: $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  # Expand the {os, install-method, update-method} support matrix
  # (scripts/sandbox/generate-e2e-matrix.mjs) into one job per combination.
  # Implemented combos land in the linux/windows matrices below; everything
  # the spec declares but CI can't drive yet lands in `skipped`, so the TODO
  # surface is visible in every run instead of buried in comments.
  generate-matrix:
    name: Generate combination matrix
    needs: pick-releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.gen.outputs.linux }}
      windows: ${{ steps.gen.outputs.windows }}
      skipped: ${{ steps.gen.outputs.skipped }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: scripts/sandbox/generate-e2e-matrix.mjs
          sparse-checkout-cone-mode: false
      - id: gen
        run: |
          set -euo pipefail
          matrices="$(node scripts/sandbox/generate-e2e-matrix.mjs \
            --tags '${{ needs.pick-releases.outputs.tags }}' \
            --route '${{ inputs.route || 'all' }}')"
          echo "$matrices"
          for key in linux windows skipped; do
            echo "$key=$(echo "$matrices" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.stringify(JSON.parse(d)[process.argv[1]])))' "$key")" >> "$GITHUB_OUTPUT"
          done

  # Linux sandbox legs: one job per {install-method -> update-method, release
  # tag} combination, each a real curl|bash install in bubblewrap followed by
  # the combo's update route.
  linux:
    name: "linux: ${{ matrix.name }}"
    if: fromJSON(needs.generate-matrix.outputs.linux).include[0] != null
    needs: generate-matrix
    strategy:
      # One combo breaking is worth knowing about even if another already
      # failed, so let every leg report.
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.linux) }}
    uses: ./.github/workflows/install-e2e-run.yml
    with:
      route: ${{ matrix.route }}
      install-ref: ${{ matrix.install_ref }}

  # Windows GUI legs: one job per combination of the real desktop user flow
  # (website installer clicked by AutoHotkey, update driven through the app).
  windows:
    name: "windows: ${{ matrix.name }}"
    if: fromJSON(needs.generate-matrix.outputs.windows).include[0] != null
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.windows) }}
    uses: ./.github/workflows/install-e2e-windows-run.yml
    with:
      route: ${{ matrix.route }}
      install-ref: ${{ matrix.install_ref }}

  # Declared-but-unimplemented combinations: one job per combo, each a
  # NATIVE skip (grey, conclusion=skipped, no runner). Matrix context is not
  # available in job-level `if`, so the native skip lives in the called
  # workflow instead: its inner job is gated on an input that defaults to
  # false and is never passed. Implementing a combo moves it into
  # IMPLEMENTED in the generator.
  skipped:
    name: "todo: ${{ matrix.os }}: ${{ matrix.install }} -> ${{ matrix.update }}"
    if: fromJSON(needs.generate-matrix.outputs.skipped).include[0] != null
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.skipped) }}
    uses: ./.github/workflows/install-e2e-skip.yml
