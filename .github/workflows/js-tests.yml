# .github/workflows/js-tests.yml
name: JS Tests

on:
  workflow_call:

jobs:
  workspaces:
    name: List npm workspaces
    # Small runner: checkout plus an npm workspace query.
    runs-on: arc-runner-small
    timeout-minutes: 20
    outputs:
      checks: ${{ steps.set-matrix.outputs.checks }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: set-matrix
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const rootPkg = JSON.parse(fs.readFileSync("package.json", "utf-8"));
          const patterns = rootPkg.workspaces || [];

          // minimal glob support: exact dirs ("packages/foo") and single-level wildcards ("packages/*")
          function expandPattern(pattern) {
            if (!pattern.includes("*")) {
              return fs.existsSync(pattern) ? [pattern] : [];
            }
            const [base] = pattern.split("*");
            const parentDir = base.replace(/\/$/, "");
            if (!fs.existsSync(parentDir)) return [];
            return fs.readdirSync(parentDir, { withFileTypes: true })
              .filter(d => d.isDirectory())
              .map(d => path.join(parentDir, d.name));
          }

          const dirs = [...new Set(patterns.flatMap(expandPattern))];

          const pkgs = dirs
            .map(dir => {
              const pkgPath = path.join(dir, "package.json");
              if (!fs.existsSync(pkgPath)) return null;
              const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf-8"));
              return { location: dir, name: pkg.name, scripts: pkg.scripts || {} };
            })
            .filter(Boolean);

          if (pkgs.length === 0) {
            console.error("::error::Workspace discovery produced an empty package list — refusing to emit a zero-length matrix (would skip all JS/TS checks silently).");
            process.exit(1);
          }

          const checks = [];
          for (const pkg of pkgs) {
            const subs = Object.keys(pkg.scripts).filter(s => /^check:.+$/.test(s));
            if (subs.length > 0) {
              for (const script of subs) {
                checks.push({ package: pkg.location, script });
              }
            } else if (pkg.scripts.check) {
              checks.push({ package: pkg.location, script: "check" });
            }
          }

          if (checks.length === 0) {
            console.error("::error::No check scripts found in any workspace package.");
            process.exit(1);
          }

          process.stdout.write("checks=" + JSON.stringify(checks) + "\n");
          ' >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.package }} / ${{ matrix.script }}
    needs: workspaces
    runs-on: arc-runner-set
    timeout-minutes: 20
    strategy:
      matrix:
        include: ${{ fromJson(needs.workspaces.outputs.checks) }}
      fail-fast: false # report all failures, not just the first one
    steps:
      - name: Seed git objects from the node-local mirror
        # The GKE runner nodes keep a bare mirror of this repo on local disk
        # (hermes-agent-ci-infra k8s/git-mirror-daemonset.yaml). Pointing a fresh
        # .git at it via alternates makes the checkout below resolve nearly every
        # object locally — ~1MB fetched instead of ~61MB. That matters because ~40
        # pods check out at once and saturate the pool's egress; measured on a
        # seeded node, 4-6s vs 7-17s for the same shallow checkout.
        #
        # actions/checkout is unmodified: it reuses an existing .git when the fetch
        # URL matches (git-directory-helper.ts prepareExistingDirectory), so this
        # survives into the real checkout.
        shell: bash
        run: |
          set -euo pipefail
          MIRROR=/mnt/git-mirror/hermes-agent.git
          # Absent on ubuntu-latest, the arm64 pool, and any node whose mirror has
          # not seeded yet. Never fail a job over it — a normal checkout follows.
          if [ ! -d "$MIRROR/objects" ]; then
            echo "::notice::no node mirror, using a normal checkout"; exit 0
          fi
          # Written by the DaemonSet as root, jobs run as uid 1001; git refuses a
          # repo owned by another user regardless of file permissions.
          git config --global --add safe.directory "$MIRROR"
          if ! git -C "$MIRROR" rev-parse --git-dir >/dev/null 2>&1; then
            echo "::warning::node mirror unreadable, using a normal checkout"; exit 0
          fi
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then exit 0; fi
          git init --quiet "$GITHUB_WORKSPACE"
          echo "$MIRROR/objects" > "$GITHUB_WORKSPACE/.git/objects/info/alternates"
          echo "::notice::seeded git alternates from $MIRROR"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: npm-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            ui-tui/node_modules
            ui-tui/packages/*/node_modules
            web/node_modules
            tests-js/node_modules
          # node26 in the key: node-pty/electron native artifacts are
          # node-major-specific; sync with NODE_MAJOR in the runner image
          # (hermes-agent-ci-infra runner/Dockerfile).
          key: node-modules-full-node26-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - uses: ./.github/actions/retry
        with:
          command: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'

      - uses: ./.github/actions/profile
        with:
          label: js-${{ matrix.package }}-${{ matrix.script }}
          command: npm run --prefix ${{ matrix.package }} ${{ matrix.script }}
