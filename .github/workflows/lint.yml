name: Lint (ruff + ty)

# Two things here:
#   1. Advisory diff — ruff + ty diagnostics as a diff vs the target branch.
#      Writes a Markdown summary to the run page. Exit zero always.
#   2. Blocking ``ruff check .`` — enforces the explicit rules in
#      ``[tool.ruff.lint.select]`` (currently PLW1514). Failure blocks merge.
#      Separate job so the advisory diff still runs even when enforcement
#      fails.
#
# CI-sensitive file review was previously here as a ``ci-review`` job but
# has moved to ``review-labels.yml`` so it can be rerun independently.

on:
  workflow_call:
    inputs:
      event_name:
        description: The event name from the calling orchestrator (pull_request or push).
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-diff:
    name: ruff + ty diff
    if: inputs.event_name == 'pull_request'
    # Small runner: ruff/ty are cheap; the job is mostly checkout.
    runs-on: arc-runner-small
    timeout-minutes: 10
    steps:
      - name: Seed git objects from the node-local mirror
        # The GKE runner nodes keep a bare mirror of this repo on local disk
        # (hermes-agent-ci-infra k8s/git-mirror-daemonset.yaml). Pointing a fresh
        # .git at it via alternates makes the checkout below resolve nearly every
        # object locally — ~1MB fetched instead of ~61MB. That matters because ~40
        # pods check out at once and saturate the pool's egress.
        #
        # It matters doubly with fetch-depth: 0 — an unshallow fetch with no mirror
        # is the worst case of all (measured 117s on a 1Gi pod). With the mirror the
        # history is already on local disk.
        #
        # actions/checkout is unmodified: it reuses an existing .git when the fetch
        # URL matches (git-directory-helper.ts prepareExistingDirectory).
        shell: bash
        run: |
          set -euo pipefail
          MIRROR=/mnt/git-mirror/hermes-agent.git
          if [ ! -d "$MIRROR/objects" ]; then
            echo "::notice::no node mirror, using a normal checkout"; exit 0
          fi
          git config --global --add safe.directory "$MIRROR"
          if ! git -C "$MIRROR" rev-parse --git-dir >/dev/null 2>&1; then
            echo "::warning::node mirror unreadable, using a normal checkout"; exit 0
          fi
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then exit 0; fi
          git init --quiet "$GITHUB_WORKSPACE"
          echo "$MIRROR/objects" > "$GITHUB_WORKSPACE/.git/objects/info/alternates"
          echo "::notice::seeded git alternates from $MIRROR"

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # NOT fetch-depth: 0. This job needs the base commit's tree (it runs
          # ruff/ty inside a worktree at that SHA) plus enough history to
          # resolve a merge base — it does not need all 19k commits or all
          # 1400 branches.
          #
          # fetch-depth: 0 makes actions/checkout fetch every ref: the last
          # run logged 1401 "new branch" lines and spent 76s here, against
          # 3-6s for the shallow jobs on the same node with the same mirror.
          # The node-local mirror supplies the objects cheaply, but ref
          # negotiation across 1400 branches is its own cost and the mirror
          # does nothing for it.
          #
          # The targeted deepen below gets the same capability in ~8s / 83MB
          # instead of ~33s / 419MB (measured against this PR's branch).
          fetch-depth: 1

      - name: Deepen to the merge base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # On push events there is no PR payload; HEAD~1 is the comparison
          # point and a depth-2 history covers it.
          if [ -z "${BASE_SHA:-}" ]; then
            git fetch --deepen=1 -q || true
            exit 0
          fi
          # Fetch the base commit itself, then deepen both sides until their
          # histories connect. 50 is comfortably more than the usual PR depth;
          # if a branch is older than that the merge-base step below fails
          # loudly rather than silently diffing against the wrong commit.
          git fetch --depth=1 origin "$BASE_SHA" -q
          git fetch --deepen=50 origin "$BASE_SHA" -q || true
          git fetch --deepen=50 -q || true

      - name: Install ruff + ty
        uses: ./.github/actions/retry
        with:
          command: uv tool install ruff && uv tool install ty

      - name: Determine base ref
        id: base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # For PRs, diff against the merge base with the target branch.
          # For pushes to main, diff against the previous commit on main.
          #
          # Uses the event payload's base SHA rather than `origin/<base_ref>`:
          # the shallow checkout above never creates that remote-tracking
          # ref, and the payload gives us the commit directly.
          if [ "${{ inputs.event_name }}" = "pull_request" ]; then
            BASE_SHA=$(git merge-base "$PR_BASE_SHA" HEAD)
            BASE_REF="${{ github.base_ref }}"
          else
            BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            BASE_REF="HEAD~1"
          fi
          echo "sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "Base SHA: ${BASE_SHA}"
          echo "Base ref: ${BASE_REF}"

      - name: Run ruff + ty on HEAD
        run: |
          mkdir -p .lint-reports/head
          ruff check --output-format json --exit-zero \
            > .lint-reports/head/ruff.json || true
          ty check --output-format gitlab --exit-zero \
            > .lint-reports/head/ty.json || true
          echo "HEAD ruff: $(wc -c < .lint-reports/head/ruff.json) bytes"
          echo "HEAD ty:   $(wc -c < .lint-reports/head/ty.json) bytes"

      - name: Run ruff + ty on base (via git worktree)
        run: |
          mkdir -p .lint-reports/base
          # Use a worktree so we don't clobber the main checkout. If the basex
          # SHA is identical to HEAD (e.g. first commit), skip and leave the
          # base reports empty — the diff script handles missing files.
          HEAD_SHA=$(git rev-parse HEAD)
          BASE_SHA="${{ steps.base.outputs.sha }}"
          if [ "$BASE_SHA" = "$HEAD_SHA" ]; then
            echo "Base SHA == HEAD SHA, skipping base scan."
            echo '[]' > .lint-reports/base/ruff.json
            echo '[]' > .lint-reports/base/ty.json
          else
            git worktree add --detach /tmp/lint-base "$BASE_SHA"
            (
              cd /tmp/lint-base
              ruff check --output-format json --exit-zero \
                > "$GITHUB_WORKSPACE/.lint-reports/base/ruff.json" || true
              ty check --output-format gitlab --exit-zero \
                > "$GITHUB_WORKSPACE/.lint-reports/base/ty.json" || true
            )
            git worktree remove --force /tmp/lint-base
          fi
          echo "base ruff: $(wc -c < .lint-reports/base/ruff.json) bytes"
          echo "base ty:   $(wc -c < .lint-reports/base/ty.json) bytes"

      - name: Generate diff summary
        env:
          HEAD_REF: ${{ inputs.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          python3 scripts/lint_diff.py \
            --base-ruff .lint-reports/base/ruff.json \
            --head-ruff .lint-reports/head/ruff.json \
            --base-ty   .lint-reports/base/ty.json \
            --head-ty   .lint-reports/head/ty.json \
            --base-ref  "${{ steps.base.outputs.ref }}" \
            --head-ref  "$HEAD_REF" \
            --output    .lint-reports/summary.md
          cat .lint-reports/summary.md >> "$GITHUB_STEP_SUMMARY"

  ruff-blocking:
    # Enforce the rules in pyproject.toml [tool.ruff.lint.select]. Currently
    # PLW1514 (unspecified-encoding) — catches bare ``open()`` /
    # ``read_text()`` / ``write_text()`` calls that default to locale
    # encoding on Windows. Failure here blocks merge; the advisory
    # ``lint-diff`` job above runs independently so reviewers still get
    # the diff comment even when enforcement fails.
    name: ruff enforcement (blocking)
    # Small runner: ruff/ty are cheap; the job is mostly checkout.
    runs-on: arc-runner-small
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ruff
        uses: ./.github/actions/retry
        with:
          command: uv tool install ruff

      - name: ruff check .
        # No --exit-zero, no || true. Exit code propagates to the job,
        # which propagates to the required-check gate.
        uses: ./.github/actions/profile
        with:
          label: ruff-blocking
          command: ruff check .

  windows-footguns:
    # Static guardrails on Windows-unsafe Python primitives — os.kill(pid, 0),
    # os.killpg, os.setsid, signal.SIGKILL without getattr fallback,
    # shebang scripts via subprocess, bare open() without encoding=, etc.
    # See scripts/check-windows-footguns.py for the full rule list.
    name: Windows footguns (blocking)
    # Small runner: checkout plus a small python checker.
    runs-on: arc-runner-small
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run footgun checker
        run: uv run scripts/check-windows-footguns.py --all
