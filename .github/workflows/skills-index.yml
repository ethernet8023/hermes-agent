name: Build Skills Index

on:
  schedule:
    # Run twice daily: 6 AM and 6 PM UTC
    - cron: "0 6,18 * * *"
  workflow_dispatch: # Manual trigger
  push:
    branches: [main]
    paths:
      - "scripts/build_skills_index.py"
      - ".github/workflows/skills-index.yml"

permissions:
  contents: read
  actions: write # to trigger deploy-site.yml on schedule

jobs:
  build-index:
    # Only run on the upstream repository, not on forks
    if: github.repository == 'NousResearch/hermes-agent'
    runs-on: arc-runner-set
    timeout-minutes: 15
    environment: trusted-automation
    steps:
      - name: Seed git objects from the node-local mirror
        # The GKE runner nodes keep a bare mirror of this repo on local disk
        # (hermes-agent-ci-infra k8s/git-mirror-daemonset.yaml). Pointing a fresh
        # .git at it via alternates makes the checkout below resolve nearly every
        # object locally — ~1MB fetched instead of ~61MB. That matters because ~40
        # pods check out at once and saturate the pool's egress; measured on a
        # seeded node, 4-6s vs 7-17s for the same shallow checkout.
        #
        # actions/checkout is unmodified: it reuses an existing .git when the fetch
        # URL matches (git-directory-helper.ts prepareExistingDirectory), so this
        # survives into the real checkout.
        shell: bash
        run: |
          set -euo pipefail
          MIRROR=/mnt/git-mirror/hermes-agent.git
          # Absent on ubuntu-latest, the arm64 pool, and any node whose mirror has
          # not seeded yet. Never fail a job over it — a normal checkout follows.
          if [ ! -d "$MIRROR/objects" ]; then
            echo "::notice::no node mirror, using a normal checkout"; exit 0
          fi
          # Written by the DaemonSet as root, jobs run as uid 1001; git refuses a
          # repo owned by another user regardless of file permissions.
          git config --global --add safe.directory "$MIRROR"
          if ! git -C "$MIRROR" rev-parse --git-dir >/dev/null 2>&1; then
            echo "::warning::node mirror unreadable, using a normal checkout"; exit 0
          fi
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then exit 0; fi
          git init --quiet "$GITHUB_WORKSPACE"
          echo "$MIRROR/objects" > "$GITHUB_WORKSPACE/.git/objects/info/alternates"
          echo "::notice::seeded git alternates from $MIRROR"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get GitHub App token
        id: app-token
        uses: ./.github/actions/get-app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: pip install httpx==0.28.1 pyyaml==6.0.2

      - name: Build skills index
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/build_skills_index.py

      - name: Upload index artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: skills-index
          path: website/static/api/skills-index.json
          retention-days: 7

  # Re-trigger the docs deploy so the refreshed index lands on the live site.
  # The deploy itself is owned by deploy-site.yml (which crawls and deploys
  # everything in one pipeline); we just kick it on a schedule.
  trigger-deploy:
    needs: build-index
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: arc-runner-set
    timeout-minutes: 15
    environment: trusted-automation
    steps:
      - name: Get GitHub App token
        id: app-token
        uses: ./.github/actions/get-app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Trigger Deploy Site workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh workflow run deploy-site.yml --repo ${{ github.repository }} -f skills_index_run_id=${{ github.run_id }}
