name: TUR redirect debug
on:
  push:
    branches: [wt/tur-debug]
jobs:
  debug:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Trace the TUR 302 hop by hop
        shell: bash
        run: |
          python3 - <<'EOF'
          import urllib.request, urllib.error

          url = "https://tur.kcubeterm.com/pool/tur/python3.11_3.11.15_aarch64.deb"
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) hermes-pm/1.0"}

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  print(f"HOP {code}: {newurl}")
                  return None
          op = urllib.request.build_opener(NoRedirect)

          req = urllib.request.Request(url, headers={**UA, "Range": "bytes=0-1023"})
          try:
              r = op.open(req, timeout=60)
              print("no redirect?!", r.status)
          except urllib.error.HTTPError as e:
              print("stopped at first hop:", e.code)
              loc = e.headers.get("Location")
              print("Location:", loc)
              # now GET the Location DIRECTLY, with and without Range
              if loc:
                  for label, hdrs in (("plain", UA), ("with-range", {**UA, "Range": "bytes=0-1023"})):
                      try:
                          r2 = urllib.request.urlopen(urllib.request.Request(loc, headers=hdrs), timeout=60)
                          print(f"{label}: {r2.status} | first bytes {r2.read(16)!r}")
                      except urllib.error.HTTPError as e2:
                          print(f"{label}: HTTP {e2.code} {e2.reason}")
                          body = e2.read(300)
                          print(f"  body: {body[:300]!r}")
          EOF
          # THE ISOLATION TEST: pm's _OPENER (custom redirect+forwarded
          # headers) vs STOCK urlopen, same URL, same Range, one runner.
          python3 - <<'EOF'
          import sys, urllib.request
          sys.path.insert(0, ".")
          from pm.downloader import _OPENER, _UA
          url = "https://tur.kcubeterm.com/pool/tur/python3.11_3.11.15_aarch64.deb"

          # A: pm's opener with Range (the exact failing combo)
          try:
              req = urllib.request.Request(url, headers={**_UA, "Range": "bytes=0-1023"})
              with _OPENER.open(req, timeout=60) as r:
                  print(f"A pm-opener+range: {r.status}")
          except urllib.error.HTTPError as e:
              print(f"A pm-opener+range: {e.code}")

          # B: STOCK urlopen with Range (no custom handlers)
          try:
              req = urllib.request.Request(url, headers={**_UA, "Range": "bytes=0-1023"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  print(f"B stock+range: {r.status}")
          except urllib.error.HTTPError as e:
              print(f"B stock+range: {e.code}")

          # C: pm opener WITHOUT range
          try:
              req = urllib.request.Request(url, headers=_UA)
              with _OPENER.open(req, timeout=60) as r:
                  print(f"C pm-opener-norange: {r.status}")
          except urllib.error.HTTPError as e:
              print(f"C pm-opener-norange: {e.code}")

          # D: dump the redirect chain headers under pm opener
          class Spy(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  print(f"D hop {code} -> {newurl[:100]}")
                  print(f"D  sent headers: {dict(req.header_items())}")
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          import pm.downloader as dl
          saved = dl._HttpsRedirectHandler.redirect_request
          def spied(self, req, fp, code, msg, headers, newurl):
              print(f"D hop {code} -> {newurl[:100]}")
              print(f"D  sent headers: {dict(req.header_items())}")
              return saved(self, req, fp, code, msg, headers, newurl)
          dl._HttpsRedirectHandler.redirect_request = spied
          try:
              req = urllib.request.Request(url, headers={**_UA, "Range": "bytes=0-1023"})
              with dl._OPENER.open(req, timeout=60) as r:
                  print(f"D pm-opener spied: {r.status}")
          except urllib.error.HTTPError as e:
              print(f"D pm-opener spied: {e.code}")
          # E: THE FULL Download path (probe + parallel ranged workers)
          # against a real store, exactly as stage_only drives it.
          python3 - <<'EOF'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, ".")
          from pm.store import download
          url = "https://tur.kcubeterm.com/pool/tur/python3.11_3.11.15_aarch64.deb"
          sha = "b927d1cbeacffb426d52e4860650caf9afd1945f85eaece26f37ae3327d5fa7c"
          with tempfile.TemporaryDirectory() as td:
              try:
                  archive = download(url, Path(td), sha)
                  data = archive.read_bytes()
                  import hashlib
                  print(f"E full store.download: OK {len(data)} bytes, digest-match={hashlib.sha256(data).hexdigest() == sha}")
              except Exception as e:
                  print(f"E full store.download: FAILED {type(e).__name__}: {e}")
          EOF
          EOF
