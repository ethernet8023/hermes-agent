name: TUR redirect debug
on:
  push:
    branches: [wt/tur-debug]
jobs:
  debug:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Trace the TUR 302 hop by hop
        shell: bash
        run: |
          python3 - <<'EOF'
          import urllib.request, urllib.error

          url = "https://tur.kcubeterm.com/pool/tur/python3.11_3.11.15_aarch64.deb"
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) hermes-pm/1.0"}

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  print(f"HOP {code}: {newurl}")
                  return None
          op = urllib.request.build_opener(NoRedirect)

          req = urllib.request.Request(url, headers={**UA, "Range": "bytes=0-1023"})
          try:
              r = op.open(req, timeout=60)
              print("no redirect?!", r.status)
          except urllib.error.HTTPError as e:
              print("stopped at first hop:", e.code)
              loc = e.headers.get("Location")
              print("Location:", loc)
              # now GET the Location DIRECTLY, with and without Range
              if loc:
                  for label, hdrs in (("plain", UA), ("with-range", {**UA, "Range": "bytes=0-1023"})):
                      try:
                          r2 = urllib.request.urlopen(urllib.request.Request(loc, headers=hdrs), timeout=60)
                          print(f"{label}: {r2.status} | first bytes {r2.read(16)!r}")
                      except urllib.error.HTTPError as e2:
                          print(f"{label}: HTTP {e2.code} {e2.reason}")
                          body = e2.read(300)
                          print(f"  body: {body[:300]!r}")
          EOF
