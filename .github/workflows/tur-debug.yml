name: Secret visibility debug
on:
  push:
    branches: [wt/tur-debug]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    environment: release-signing
    steps:
      - name: Probe env + repo secret visibility
        shell: bash
        env:
          ENV_KEY: ${{ secrets.TERMUX_APT_GPG_KEY }}
          REPO_KEY: ${{ secrets.HERMES_SIGNING_KEY }}
        run: |
          echo "env TERMUX_APT_GPG_KEY: ${#ENV_KEY} chars"
          echo "repo HERMES_SIGNING_KEY: ${#REPO_KEY} chars"
