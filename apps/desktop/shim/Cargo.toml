[package]
name = "hermes-shim"
version = "0.1.0"
edition = "2021"
description = "Self-relative CLI trampoline for bundled Hermes desktop installs."
license = "MIT"
publish = false

[[bin]]
name = "hermes-shim"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
